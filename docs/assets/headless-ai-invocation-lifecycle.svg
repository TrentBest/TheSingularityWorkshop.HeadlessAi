<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">HeadlessAi invocation lifecycle and trust boundaries</title>
<desc id="desc">An animated conceptual map of a bounded HTTP invocation. The host prepares intent and configuration, HeadlessAi maps a request through an endpoint adapter and bounded HTTP transport, the adapter extracts response content, and the host performs semantic validation and policy decisions. Failures return as data for the host to handle; responses never grant themselves authority.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111e"/><stop offset="1" stop-color="#172238"/></linearGradient>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#67e8f9"/></marker>
 <style>
 text{font-family:Arial,sans-serif}.title{font-size:33px;font-weight:700;fill:#f8fafc;letter-spacing:1px}.sub{font-size:17px;fill:#93c5fd;letter-spacing:2px}.label{font-size:15px;fill:#94a3b8;letter-spacing:1.3px}.main{font-size:19px;fill:#f8fafc}.detail{font-size:15px;fill:#cbd5e1}.mono{font-family:monospace;font-size:17px;fill:#f8fafc}.box{fill:#0d1b2c;stroke:#475569;stroke-width:2}.host{fill:#142b25;stroke:#34d399;stroke-width:2}.core{fill:#111d35;stroke:#60a5fa;stroke-width:2}.endpoint{fill:#2a1d39;stroke:#c4b5fd;stroke-width:2}.fail{fill:#321a26;stroke:#fb7185;stroke-width:2}.arrow{fill:none;stroke:#67e8f9;stroke-width:3;marker-end:url(#arr)}.dash{fill:none;stroke:#fb7185;stroke-width:2.5;stroke-dasharray:8 7}.glow{animation:glow 3.4s ease-in-out infinite}.flow{stroke-dasharray:10 8;animation:flow 5s linear infinite}@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-72}}
 </style>
</defs>
<rect width="1200" height="1000" fill="url(#bg)"/>
<text x="600" y="60" text-anchor="middle" class="title">ONE BOUNDED INVOCATION. CLEAR TRUST BOUNDARIES.</text>
<text x="600" y="92" text-anchor="middle" class="sub">HEADLESSAI SENDS AND EXTRACTS — THE HOST DECIDES</text>

<rect x="65" y="135" width="1070" height="140" rx="20" class="host"/>
<text x="100" y="172" class="label">1 · HOST PREPARES THE CALL</text>
<text x="100" y="211" class="main">Task intent · endpoint profile · credentials · cancellation</text>
<text x="100" y="244" class="detail">The application chooses the goal and supplies the configuration. Secrets stay under host control.</text>
<path d="M600 276 V320" class="arrow flow"/>

<rect x="65" y="330" width="1070" height="240" rx="20" class="core"/>
<text x="100" y="369" class="label">2 · HEADLESSAI INVOCATION BOUNDARY</text>
<rect x="105" y="395" width="285" height="120" rx="14" class="box"/>
<text x="247" y="430" text-anchor="middle" class="main">Endpoint adapter</text>
<text x="247" y="461" text-anchor="middle" class="detail">maps request shape</text>
<text x="247" y="486" text-anchor="middle" class="detail">extracts response content</text>
<path d="M400 455 H465" class="arrow flow"/>
<rect x="480" y="395" width="285" height="120" rx="14" class="box glow"/>
<text x="622" y="430" text-anchor="middle" class="main">HTTP transport</text>
<text x="622" y="461" text-anchor="middle" class="detail">timeout · cancellation</text>
<text x="622" y="486" text-anchor="middle" class="detail">bounded response size</text>
<path d="M775 455 H840" class="arrow flow"/>
<rect x="855" y="395" width="235" height="120" rx="14" class="endpoint"/>
<text x="972" y="430" text-anchor="middle" class="main">Configured endpoint</text>
<text x="972" y="461" text-anchor="middle" class="detail">remote API + inference</text>
<text x="972" y="486" text-anchor="middle" class="detail">provider protocol applies</text>
<text x="600" y="548" text-anchor="middle" class="detail">HeadlessAi does not own task meaning, conversation memory, permissions, or execution.</text>

<path d="M970 572 V615 H600 V645" class="arrow flow"/>
<rect x="65" y="655" width="1070" height="130" rx="20" class="box"/>
<text x="100" y="693" class="label">3 · RETURNED RESULT OR FAILURE</text>
<rect x="105" y="710" width="420" height="52" rx="12" class="host"/>
<text x="315" y="742" text-anchor="middle" class="main">Extracted content returned to host</text>
<rect x="675" y="710" width="415" height="52" rx="12" class="fail"/>
<text x="882" y="742" text-anchor="middle" class="main">Timeout · HTTP error · malformed response</text>
<path d="M600 645 V685 H315 V706" class="arrow"/>
<path d="M600 645 V685 H882 V706" class="dash"/>
<text x="600" y="813" text-anchor="middle" class="detail">Success and failure are both outcomes to handle — neither is permission to act.</text>

<path d="M315 785 V830" class="arrow"/>
<rect x="65" y="840" width="1070" height="115" rx="20" class="host"/>
<text x="100" y="876" class="label">4 · HOST-OWNED ACCEPTANCE GATES</text>
<text x="100" y="911" class="main">Protocol shape → structure → semantic meaning → policy / authorization</text>
<text x="100" y="937" class="detail">Only application logic decides whether the result is trusted, shown, retried, rejected, or acted upon.</text>
<text x="600" y="985" text-anchor="middle" class="detail">A response is data. It cannot grant itself authority.</text>
</svg>