name: NuGet Release Verification (Non-Publishing)

on:
  push:
    branches: ["feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Confirm workflow is executable
        run: echo "Release verification workflow syntax and runner startup passed."
