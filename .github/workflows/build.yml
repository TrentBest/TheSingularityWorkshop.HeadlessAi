name: Development Build, Test, and Coverage

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: HeadlessAi
      - name: Checkout FSM_Serialization development source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: TrentBest/TheSingularityWorkshop.FSM_Serialization
          ref: development
          path: dependencies/FSM_Serialization
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
      - name: Restore
        working-directory: HeadlessAi
        run: dotnet restore TheSingularityWorkshop.HeadlessAi.slnx
      - name: Build
        working-directory: HeadlessAi
        run: dotnet build TheSingularityWorkshop.HeadlessAi.slnx --configuration Release --no-restore
      - name: Test with coverage
        working-directory: HeadlessAi
        run: dotnet test TheSingularityWorkshop.HeadlessAi.slnx --configuration Release --no-build --collect:"XPlat Code Coverage;Format=cobertura" --results-directory ./TestResults
      - name: Prepare coverage report
        working-directory: HeadlessAi
        shell: bash
        run: |
          set -euo pipefail
          coverage_file="$(find ./TestResults -type f -name 'coverage.cobertura.xml' -print -quit)"
          if [[ -z "$coverage_file" ]]; then
            echo "No coverage.cobertura.xml file was produced."
            find ./TestResults -maxdepth 4 -type f -print || true
            exit 1
          fi
          cp "$coverage_file" ./TestResults/coverage.cobertura.xml
          echo "Prepared coverage report: $coverage_file"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: TrentBest/TheSingularityWorkshop.HeadlessAi
          files: HeadlessAi/TestResults/coverage.cobertura.xml
          fail_ci_if_error: true

  verify-package:
    name: Non-publishing package verification
    uses: ./.github/workflows/release-verification.yml
    with:
      candidate_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      fsm_serialization_version: '1.0.0'

# Package verification builds against the exact published dependency, audits one
# candidate archive, and proves it installs in a clean consumer. It only uploads
# an artifact; it never publishes, creates a release, deploys, merges, or writes.
